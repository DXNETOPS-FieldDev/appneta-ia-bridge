# TLS-terminating reverse proxy for appneta-ia-bridge.
#
# Certificate and key are NOT bundled -- they must be supplied by whoever runs the
# container (mount them at the paths below). See README.md, "TLS termination".
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name _;

    ssl_certificate     /etc/appneta-ia-bridge/tls/cert.pem;
    ssl_certificate_key /etc/appneta-ia-bridge/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # TLS 1.2 AEAD suites with forward secrecy only (TLS 1.3 suites are not
    # configurable here and are all AEAD). Safe under FIPS-mode OpenSSL.
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    # Generous but bounded -- alarm payloads are small JSON objects; this is a
    # defense-in-depth cap, not a functional requirement.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
