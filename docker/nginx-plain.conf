# Plain-HTTP reverse proxy for appneta-ia-bridge -- used when TLS_ENABLED=false.
#
# No certificate needed. This exists for environments where AppNeta's connector
# is configured with an http:// URL and a real, publicly-trusted certificate
# isn't available yet -- see README.md, "TLS termination", for why that means
# the webhook auth secret travels in cleartext, and get a real cert as soon as
# one is available. nginx is still used here (not just for symmetry) so
# alarm_bridge's own port stays unprivileged and the external port-mapping
# chain (whatever maps to :443 inside this container) doesn't need to change
# if TLS is turned on later.
server {
    listen 443;
    listen [::]:443;
    server_name _;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
