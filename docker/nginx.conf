# Minimal top-level nginx config for the UBI image.
#
# RHEL's packaged nginx.conf ships its own `server { listen 80; ... }` block
# inline, which would sit next to our server and answer on a port nobody asked
# for. Replace it wholesale and load only conf.d/ -- where entrypoint.sh places
# the TLS or plain server block.
#
# The whole container runs as one unprivileged user (see Dockerfile), so nothing
# here may need root: no `user` directive, a pid file and temp paths under /tmp,
# the access log off (one line per request buried the bridge's summaries),
# errors to stderr, and a listen port above 1024.
worker_processes auto;
error_log /dev/stderr;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    sendfile on;

    # Don't advertise the nginx version in headers or error pages.
    server_tokens off;

    # Alarm webhooks are small, fast POSTs. Bound how long a client may hold a
    # connection open without sending data (slowloris-style resource pinning).
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 15s;
    include /etc/nginx/conf.d/*.conf;
}
