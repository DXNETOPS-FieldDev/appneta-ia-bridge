# appneta-ia-general v1 -- BEGIN -- AppNeta Intelligent Alarms
# Severity-keyed scheme shared with Spectrum's `general` mode (same wire OIDs/varbinds,
# apnNotifBranch .126-.133).
# $Vn$ indices match alarm_bridge.mapping.map_alarm_to_general_trap's varbind order:
# V5 description, V7 itemName, V9 target, V16 providerLink (AppNeta URL).
# Managed by smarts-install/install.sh -- do not hand-edit. uninstall.sh removes exactly
# this block by matching this marker pair.
#
# Severity values follow Smarts' own scale (see the "SEVERITY VALUES" comment in
# conf/ics/dxa-esm-notif.conf under your Smarts install):
# 1=CRITICAL, 2=MAJOR, 3=MINOR, 4=UNKNOWN, 5=NORMAL.
# WARNING has no direct equivalent, so it maps to MINOR's severity (3) while keeping its own
# EventName/OID pair and therefore its own notification instance.

BEGIN_TRAP .1.3.6.1.4.1.19041.2.1.103 6 126
	ClassName:      SNMPTrapIndication
	InstanceName:   $V7$
	EventName:      AppNetaAlarmCritical
	Severity:       1
	EventText:      $V5$ ($V9$) $V16$
	State:          NOTIFY
	EventType:      DURABLE
	Expiration:     0
	ElementClassName: Host
	ElementName:    $A$
	UnknownAgent:   CREATE
END_TRAP

BEGIN_TRAP .1.3.6.1.4.1.19041.2.1.103 6 127
	ClassName:      SNMPTrapIndication
	InstanceName:   $V7$
	EventName:      AppNetaAlarmCritical
	State:          CLEAR
END_TRAP

